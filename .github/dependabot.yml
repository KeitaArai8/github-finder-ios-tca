version: 2
updates:
  # Swift Package Manager（このプロジェクトは現時点で外部 SPM 依存なし。
  # 将来導入された場合に自動で更新 PR が来るよう設定）
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ios"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions の action バージョン更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
